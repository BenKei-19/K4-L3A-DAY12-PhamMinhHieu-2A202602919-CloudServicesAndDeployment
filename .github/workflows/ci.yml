# Bonus — CI/CD với GitHub Actions: test → build → deploy (Render).
#
# Mỗi lần push hoặc mở pull request vào main: chạy test trên máy sạch và build
# thử Docker image. Chỉ khi cả hai xanh VÀ đây là push lên main thì mới deploy.
#
# Cần làm một lần trước khi push:
#   1. Render → service → Settings → Deploy Hook → copy URL
#   2. GitHub repo → Settings → Secrets and variables → Actions
#      → New repository secret, tên RENDER_DEPLOY_HOOK_URL, dán URL vào
#   3. Render → service → Settings → Auto-Deploy → Off, để workflow này là
#      đường deploy duy nhất (nếu không, Render vẫn deploy mỗi lần push dù
#      test có đỏ)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd (kiểm
      # tra badge của chính workflow này). Test build image thật (marker
      # docker) để job `build` lo.
      - name: Run tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >-
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      # Build xong chưa đủ: chạy thử container để bắt lỗi import/khởi động
      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://day12-agent-59fz.onrender.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUBLIC_URL: https://day12-agent-59fz.onrender.com
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Chưa tạo secret RENDER_DEPLOY_HOOK_URL (xem đầu file ci.yml)"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

      # Render giữ bản cũ chạy tới khi bản mới live (zero-downtime), nên bước
      # này xác nhận service vẫn sống và vẫn chặn request không có key sau khi
      # deploy. Gói free có thể đang ngủ → thử lại vài lần.
      - name: Smoke test
        run: |
          sleep 45
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "$PUBLIC_URL/health" \
              && curl -fsS --max-time 30 "$PUBLIC_URL/ready"; then
              echo
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
                -H "Content-Type: application/json" -d '{"question":"smoke"}')
              if [ "$code" != "401" ]; then
                echo "::error::/ask không có key trả $code, mong đợi 401"
                exit 1
              fi
              echo "smoke test OK"
              exit 0
            fi
            echo "chưa sẵn sàng, thử lại sau 30s ($i/10)"
            sleep 30
          done
          exit 1
